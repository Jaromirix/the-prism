<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Scorch — AI Filmmaking Breakdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #000;
    --ink: #fff;
    --dim: #b8b8b8;
    --mute: #6a6a6a;
    --faint: #2a2a2a;
    --line: rgba(255,255,255,0.08);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  body { height: 100vh; display: grid; grid-template-rows: 64px 1fr 56px; }

  .mono { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px; }

  /* ── HEADER ───────────────────────────────────────────────── */
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); position: relative; z-index: 10; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark { width: 8px; height: 8px; background: var(--ink); }
  .brand .name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .brand .tag { color: var(--mute); }
  nav { display: flex; gap: 28px; }
  nav a { color: var(--dim); text-decoration: none; font-size: 13px; letter-spacing: -0.005em; transition: color .2s; }
  nav a:hover { color: var(--ink); }

  /* ── STAGE (full-bleed image + overlay text) ──────────────── */
  .stage { position: relative; overflow: hidden; background: #050505; }

  .bg { position: absolute; inset: 0; }
  .bg > img, .bg > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transform: scale(1.04); transition: opacity 1s ease, transform 1.4s cubic-bezier(.2,.6,.2,1); }
  .bg > img { object-fit: cover; object-position: 75% center; }
  .bg > img.is-active { opacity: 1; transform: scale(1); }
  .bg > img.is-leaving { opacity: 0; transition: opacity .6s ease; }

  /* centered video player (chapter 08 etc.) */
  .bg .player {
    position: absolute;
    top: 50%;
    left: calc(min(640px, 48%) + (100% - min(640px, 48%)) / 2);
    /* size: bounded by both viewport height and the available right pane */
    --max-h: 78vh;
    --max-w: calc(100% - min(640px, 48%) - 96px);
    height: var(--h, var(--max-h));
    width: var(--w, auto);
    aspect-ratio: var(--ar, 9 / 16);
    background: #000;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.04);
    transition: opacity 1s ease, transform 1.4s cubic-bezier(.2,.6,.2,1);
    pointer-events: auto;
    overflow: hidden;
  }
  .bg .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bg .player.is-active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .bg .player.is-leaving { opacity: 0; transition: opacity .6s ease; }

  /* per-aspect sizing: 9:16 fills vertically, 16:9 is more compact */
  .bg .player[data-ratio="9/16"] { height: 78vh; width: auto; max-width: calc(100% - min(640px, 48%) - 96px); }
  .bg .player[data-ratio="16/9"] { height: auto; width: min(54vw, calc(100% - min(640px, 48%) - 120px)); max-height: 60vh; }

  /* aspect toggle pills (sits just under the player) */
  .ratio-toggle {
    position: absolute;
    top: calc(50% + var(--player-half, 39vh) + 24px);
    left: calc(min(640px, 48%) + (100% - min(640px, 48%)) / 2);
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    gap: 0;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity .6s ease .2s;
  }
  .ratio-toggle.is-active { opacity: 1; }
  .ratio-toggle button {
    background: transparent; border: 0; padding: 10px 18px;
    color: var(--dim); cursor: pointer;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em;
    transition: color .2s, background .2s;
  }
  .ratio-toggle button + button { border-left: 1px solid rgba(255,255,255,.12); }
  .ratio-toggle button:hover { color: var(--ink); }
  .ratio-toggle button.on { color: #000; background: var(--ink); }

  /* download button (bottom-right) */
  .download-btn {
    position: absolute; right: 28px; bottom: 22px; z-index: 7;
    display: none; align-items: center; gap: 10px;
    padding: 12px 18px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--ink); text-decoration: none;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .download-btn.is-on { display: inline-flex; }
  .download-btn:hover { background: var(--ink); color: #000; border-color: var(--ink); }
  .download-btn:hover svg { stroke: #000; }
  .download-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .download-btn[aria-disabled="true"]:hover { background: rgba(0,0,0,.55); color: var(--ink); border-color: rgba(255,255,255,.18); }
  .download-btn[aria-disabled="true"]:hover svg { stroke: var(--ink); }
  .download-btn svg { width: 12px; height: 12px; stroke: var(--ink); stroke-width: 1.6; fill: none; transition: stroke .2s; }

  /* light safety gradient — your photoshopped fade does the real work */
  .veil { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.55) 22%, rgba(0,0,0,0.15) 42%, rgba(0,0,0,0) 60%),
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.35) 100%);
  }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  /* ── TEXT PANEL ───────────────────────────────────────────── */
  .panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(640px, 48%); z-index: 5;
    display: flex; flex-direction: column; justify-content: center;
    padding: 48px 56px 48px 56px; overflow: hidden;
  }
  .scroll { max-height: 100%; overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  .kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .kicker .idx { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.3em; color: var(--ink); }
  .kicker .rule { width: 36px; height: 1px; background: var(--ink); }
  .kicker .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }

  h1.title { font-size: clamp(44px, 5.2vw, 72px); line-height: .95; letter-spacing: -0.035em; margin: 0 0 28px; font-weight: 500; text-wrap: balance; }

  .body { font-size: clamp(16px, 1.05vw, 19px); line-height: 1.62; color: #d8d8d8; letter-spacing: -0.003em; }
  .body p { margin: 0 0 16px; }
  .body p:last-child { margin-bottom: 0; }
  .body em { font-style: normal; color: var(--ink); }

  /* numbered workflow grid */
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; margin-top: 4px; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
  .step .n { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--mute); padding-top: 2px; }
  .step .t { font-size: 14px; line-height: 1.45; color: #d8d8d8; }
  .step .t b { color: var(--ink); font-weight: 500; letter-spacing: -0.005em; display: block; margin-bottom: 2px; font-size: 14px; }

  /* tools row (chapter 06) */
  .tools-row { margin-top: 28px; display: flex; align-items: flex-start; gap: 18px; padding-top: 22px; border-top: 1px solid var(--line); }
  .tools-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute); padding-top: 8px; flex-shrink: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool {
    display: inline-block;
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,.16);
    color: #d8d8d8;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: border-color .2s, color .2s;
  }
  .tool:hover { color: var(--ink); border-color: rgba(255,255,255,.32); }

  /* fade-in for panel content */
  .panel > .scroll { animation: rise .65s cubic-bezier(.2,.6,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* bottom-right plate caption */
  .plate { display: none; position: absolute; right: 28px; bottom: 22px; text-align: right; z-index: 5; color: var(--dim); max-width: 280px; }
  .plate .lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); }
  .plate .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; color: var(--mute); letter-spacing: 0.18em; margin-top: 4px; text-transform: uppercase; }

  /* ── FOOTER ───────────────────────────────────────────────── */
  footer { display: flex; align-items: center; gap: 22px; padding: 0 32px; border-top: 1px solid var(--line); position: relative; z-index: 10; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .progress { flex: 1; display: flex; gap: 4px; max-width: 60%; }
  .progress .seg { flex: 1; height: 2px; background: var(--faint); transition: background .35s; }
  .progress .seg.on { background: var(--ink); }
  .footer-meta { display: flex; align-items: center; gap: 20px; margin-left: auto; }
  .arrows { display: flex; gap: 6px; }
  .arrow { width: 36px; height: 32px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-size: 14px; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; }
  .arrow:hover { color: var(--ink); border-color: var(--ink); }

  /* ── RESPONSIVE ───────────────────────────────────────────── */
  @media (max-width: 900px) {
    body { grid-template-rows: 56px 1fr 56px; }

    /* header */
    header { padding: 0 18px; }
    .brand .tag { display: none; }

    /* panel: full width, scrollable */
    .panel {
      left: 0; right: 0; width: auto;
      padding: 22px 22px 36px;
      justify-content: flex-start;
    }
    .scroll { padding-right: 0; }

    /* typography */
    .kicker { margin-bottom: 14px; }
    h1.title { font-size: clamp(32px, 9.5vw, 48px); line-height: 1; margin-bottom: 16px; }
    .body { font-size: 15px; line-height: 1.55; }
    .body p { margin-bottom: 12px; }

    /* workflow + tools */
    .steps { grid-template-columns: 1fr; gap: 10px; }
    .step .t { font-size: 13px; }
    .step .t b { font-size: 13px; }
    .tools-row { flex-direction: column; gap: 10px; padding-top: 16px; margin-top: 18px; }
    .tools-label { padding-top: 0; }
    .tool { padding: 5px 10px; }

    /* image chapters: stronger top/bottom dim so text reads */
    .bg > img { object-position: 70% center; }
    .veil {
      background:
        linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.4) 28%, rgba(0,0,0,.4) 72%, rgba(0,0,0,.95) 100%);
    }
    .plate { display: none; }

    /* video chapters: player anchored to top, text scrolls below it */
    .bg .player {
      top: 24px;
      transform: translate(-50%, 0) scale(1.04);
    }
    .bg .player.is-active { transform: translate(-50%, 0) scale(1); }
    .bg .player.is-leaving { transform: translate(-50%, 0) scale(1); }
    .bg .player[data-ratio="9/16"] {
      width: auto; max-width: 70vw;
      height: 50vh; max-height: 50vh;
    }
    .bg .player[data-ratio="16/9"] {
      width: 88vw; max-width: 88vw;
      height: auto; max-height: 32vh;
    }
    /* push text down so it starts under the player */
    .stage:has(.player) .panel { padding-top: calc(50vh + 96px); }
    .stage:has(.player[data-ratio="16/9"]) .panel { padding-top: calc(32vh + 100px); }

    /* ratio toggle: docked just under the player */
    .ratio-toggle {
      top: auto; bottom: auto;
      transform: translateX(-50%);
    }
    .stage:has(.player[data-ratio="9/16"]) .ratio-toggle { top: calc(24px + 50vh + 12px); }
    .stage:has(.player[data-ratio="16/9"]) .ratio-toggle { top: calc(24px + 32vh + 12px); }
    .ratio-toggle button { padding: 8px 14px; font-size: 9px; letter-spacing: 0.18em; }

    /* download button: bottom-right of stage, smaller */
    .download-btn { right: 16px; bottom: 16px; padding: 10px 14px; font-size: 9px; letter-spacing: 0.18em; }
    .download-btn svg { width: 11px; height: 11px; }

    /* footer compact */
    footer { padding: 0 18px; gap: 14px; }
    .progress { max-width: 100%; }
    #footIdx { font-size: 10px; }
    .footer-meta { gap: 10px; }
    .footer-meta #footTitle { display: none; }
    .arrow { width: 34px; height: 30px; font-size: 13px; }
  }

  /* phone */
  @media (max-width: 600px) {
    header { padding: 0 14px; }
    .brand .name { font-size: 14px; }
    .panel { padding: 18px 18px 28px; }
    h1.title { font-size: clamp(30px, 11vw, 40px); margin-bottom: 14px; }
    .kicker .idx { font-size: 10px; }
    .kicker .sub { font-size: 9px; }
    .body { font-size: 14.5px; }
    footer { padding: 0 12px; gap: 10px; }
    .arrow { width: 32px; height: 28px; }

    /* tighter video on phone */
    .bg .player[data-ratio="9/16"] { max-width: 64vw; height: 44vh; }
    .bg .player[data-ratio="16/9"] { width: 92vw; max-height: 28vh; }
    .stage:has(.player[data-ratio="9/16"]) .panel { padding-top: calc(44vh + 90px); }
    .stage:has(.player[data-ratio="16/9"]) .panel { padding-top: calc(28vh + 92px); }
    .stage:has(.player[data-ratio="9/16"]) .ratio-toggle { top: calc(24px + 44vh + 10px); }
    .stage:has(.player[data-ratio="16/9"]) .ratio-toggle { top: calc(24px + 28vh + 10px); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <span class="name">The Scorch</span>
    <span class="mono tag">/ AI Filmmaking Breakdown</span>
  </div>
</header>

<section class="stage">
  <div class="bg" id="bg"></div>
  <div class="veil"></div>
  <div class="grain"></div>

  <div class="panel">
    <div class="scroll" id="panel"></div>
  </div>

  <div class="plate" id="plate"></div>

  <a class="download-btn" id="downloadBtn" download target="_blank" rel="noopener" aria-disabled="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
    <span id="downloadLabel">Download</span>
  </a>
</section>

<footer>
  <span class="mono" id="footIdx" style="color: var(--ink)">00 / 09</span>
  <div class="progress" id="progress"></div>
  <div class="footer-meta">
    <span class="mono" id="footTitle" style="color: var(--dim)"></span>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Previous">←</button>
      <button class="arrow" id="next" aria-label="Next">→</button>
    </div>
  </div>
</footer>

<script>
  // ────────────────────────────────────────────────────────────
  // CHAPTERS — full breakdown copy. To swap an image, replace
  // the `img` URL with your photoshopped file (e.g. "assets/01.jpg").
  // The right-side cinematic image is expected to already fade
  // to black on its left edge (done in Photoshop).
  // ────────────────────────────────────────────────────────────
  const chapters = [
    {
      num: '00', title: 'The Prism',
      kicker: 'What',
      sub: 'Hook + Context Flash',
      body: `
        <p><em>The Scorch</em> — an AI filmmaking breakdown.</p>
        <p>A futuristic dystopian world built around the idea of light, transparency and refraction — a society where status is constantly observed and displayed. This is the breakdown of how it was designed, built and shot.</p>
      `,
      img: 'assets/00-intro.jpg'
    },
    {
      num: '01', title: 'Project Overview',
      kicker: 'Why The Scorch',
      sub: 'Chapter 01',
      body: `
        <p>I chose <em>The Scorch</em> because it was probably the most demanding of the three scripts. It is a fully futuristic dystopian world where a lot of things had to be designed from scratch. On top of that, the script presented specific technical challenges: floating status numbers above characters, a large‑scale ballroom with hundreds of people, and props that don't exist in the real world.</p>
        <p>But honestly, I also just wanted to see what I would create.<br />I enjoy sci‑fi and dystopian worlds, and this was an opportunity to build one entirely from my own interpretation.</p>
      `,
      img: 'assets/01-overview.jpg'
    },
    {
      num: '02', title: 'Worldbuilding Approach',
      kicker: 'The Prism',
      sub: 'Chapter 02',
      body: `
        <p>The name <em>The Prism</em> became the foundation for every visual decision. I built the entire aesthetic around the idea of light, transparency, and refraction as metaphors for a society where status is constantly observed and displayed.</p>
        <p>From there, the key design pillars came naturally: <em>glass‑dominant architecture, light as a representation of hierarchy, and fashion as a visible status signal.</em></p>
      `,
      img: 'assets/02-worldbuilding.jpg'
    },
    {
      num: '03', title: 'The Grand Ballroom',
      kicker: 'Key environment',
      sub: 'Chapter 03',
      body: `
        <p>I built the Grand Ballroom around glass as the dominant material language, directly inspired by the name <em>The Prism</em>. The goal was a space where light, reflection, and transparency are not just aesthetic choices but part of the narrative itself.</p>
        <p>The defining architectural element is a massive faceted glass dome spanning the entire ceiling, functioning as a literal prism that catches and refracts light across every surface of the room. Floor‑to‑ceiling windows open the space to the city skyline a hundred stories down, while surveillance drones positioned at the corners complete the atmosphere of total visibility.</p>
      `,
      img: 'assets/03-ballroom.jpg'
    },
    {
      num: '04', title: 'Costume Design',
      kicker: 'Fiber‑optic gowns',
      sub: 'Chapter 04',
      body: `
        <p>The script specifies <em>"fiber‑optic gowns"</em> for five hundred guests. I interpreted this as a high‑society futuristic dress code, designing the gowns around bold geometric light patterns that run across the entire silhouette, merging couture structure with a circuit‑like luminosity.</p>
        <p>A strict color hierarchy separates each layer of the narrative: <em>Cassian</em> and <em>Nova</em> wears full gold with fluid luminous lines, <em>Lyra</em> the same silhouette as Nova but in cool silver, and the crowd in structured white. The contrast ensures immediate visual readability, while Lyra's mirrored design reinforces her role as Nova's rival and reflection.</p>
      `,
      img: 'assets/04-costume.jpg'
    },
    {
      num: '05', title: 'The Choker System',
      kicker: 'Key prop',
      sub: 'Chapter 05',
      body: `
        <p>In its default state, the choker is designed to read as luxury jewelry, with overlapping polished plates and a subtle gold illumination, elegant enough to function as a status symbol and a fashion accessory simultaneously.</p>
        <p>For the transformation, I moved away from the script's <em>"thorns of black metal"</em> toward a more mechanically grounded approach: the existing plates rotate inward, their edges turning into sharp segments that press into the skin. Literal inward‑facing thorns would cause fatal injury rather than punishment, and I also wanted the transformation to feel physically believable. The mechanism needed to come from within the object itself, not appear from nowhere. The design remains visually coherent with the elegant form that precedes it.</p>
      `,
      img: 'assets/05-choker.jpg'
    },
    {
      num: '06', title: 'Production Workflow',
      kicker: 'An eight‑step system',
      sub: 'Chapter 06',
      body: `
        <p style="margin-bottom:22px">Each step is a separate discipline. The pipeline runs script → world → assets → shots → prompts → iteration → edit → sound.</p>
        <div class="steps">
          <div class="step"><span class="n">01</span><span class="t"><b>Script Analysis</b>Deep read to extract world logic, character arcs, and emotional tone.</span></div>
          <div class="step"><span class="n">02</span><span class="t"><b>World &amp; Character Design</b>Iterative visual system. Reference research, early explorations, final assets.</span></div>
          <div class="step"><span class="n">03</span><span class="t"><b>Asset Generation</b>Environment, characters, costumes, props. Status numbers refined in Photoshop.</span></div>
          <div class="step"><span class="n">04</span><span class="t"><b>Shot Design</b>Manual cinematic planning — framing, camera move, lens, emotional pacing.</span></div>
          <div class="step"><span class="n">05</span><span class="t"><b>Prompt Engineering</b>Complex structured prompts built with Claude. Shot design → visual instruction.</span></div>
          <div class="step"><span class="n">06</span><span class="t"><b>Iteration Loop</b>Multiple generation rounds. Fix inconsistencies, improve comp, hold continuity.</span></div>
          <div class="step"><span class="n">07</span><span class="t"><b>Editing</b>Assembly, sequencing and narrative pacing in CapCut.</span></div>
          <div class="step"><span class="n">08</span><span class="t"><b>Sound Design</b>Music + SFX from Artlist, mixed in CapCut. Color grade as final polish.</span></div>
        </div>
        <div class="tools-row">
          <span class="tools-label">Stack</span>
          <div class="tools">
            <span class="tool">Higgsfield</span>
            <span class="tool">Seedance 2.0</span>
            <span class="tool">Nano Banana</span>
            <span class="tool">Claude</span>
            <span class="tool">Photoshop</span>
            <span class="tool">CapCut</span>
            <span class="tool">DaVinci</span>
            <span class="tool">Artlist</span>
          </div>
        </div>
      `,
      img: 'assets/06-workflow.jpg'
    },
    {
      num: '07', title: 'Challenges',

  const panel = document.getElementById('panel');
  const plate = document.getElementById('plate');
  const progress = document.getElementById('progress');
  const bg = document.getElementById('bg');
  const footIdx = document.getElementById('footIdx');
  const footTitle = document.getElementById('footTitle');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadLabel = document.getElementById('downloadLabel');

  function setDownload(url, label) {
    downloadLabel.textContent = label || 'Download';
    if (!url) {
      downloadBtn.removeAttribute('href');
      downloadBtn.setAttribute('aria-disabled', 'true');
    } else {
      downloadBtn.href = url;
      downloadBtn.removeAttribute('aria-disabled');
    }
  }
  function showDownload(show) {
    downloadBtn.classList.toggle('is-on', !!show);
  }

  // build progress
  chapters.forEach(() => {
    const s = document.createElement('div');
    s.className = 'seg';
    progress.appendChild(s);
  });

  // image preload + crossfade
  const imgs = [];
  const removalTimers = new WeakMap();
  let current = -1;

  function buildPlayer(c, i) {
    const wrap = document.createElement('div');
    wrap.className = 'player';

    const iframe = document.createElement('iframe');
    iframe.setAttribute('allow', 'accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen');
    iframe.setAttribute('allowfullscreen', '');
    iframe.loading = 'lazy';
    wrap.appendChild(iframe);

    // single video case (legacy)
    if (c.video && !c.videos) {
      iframe.src = c.video;
      return { main: wrap, extras: [] };
    }

    // multi-aspect: build a toggle
    const stored = localStorage.getItem('scorch.aspect') || c.videos[0].ratio;
    let activeIdx = c.videos.findIndex(v => v.ratio === stored);
    if (activeIdx < 0) activeIdx = 0;

    const applyAspect = (idx) => {
      const v = c.videos[idx];
      wrap.style.setProperty('--ar', v.ratio);
      wrap.dataset.ratio = v.ratio.replace(/\s+/g, '');
      iframe.src = v.src;
      [...toggle.children].forEach((b, k) => b.classList.toggle('on', k === idx));
      localStorage.setItem('scorch.aspect', v.ratio);
      // update download button to track this aspect
      setDownload(v.download, 'Download · ' + v.label.replace(/\s+·\s+/, ' '));
      showDownload(true);
      requestAnimationFrame(() => {
        const h = wrap.getBoundingClientRect().height;
        toggle.style.setProperty('--player-half', (h / 2) + 'px');
      });
    };

    const toggle = document.createElement('div');
    toggle.className = 'ratio-toggle';
    c.videos.forEach((v, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = v.label;
      b.addEventListener('click', () => applyAspect(idx));
      toggle.appendChild(b);
    });

    applyAspect(activeIdx);
    return { main: wrap, extras: [toggle] };
  }

  function setImage(i) {
    // mark all currently-attached media as leaving
    [...bg.querySelectorAll('.is-active')].forEach(prev => {
      prev.classList.remove('is-active');
      prev.classList.add('is-leaving');
      clearTimeout(removalTimers.get(prev));
      const t = setTimeout(() => {
        if (!prev.classList.contains('is-active')) prev.remove();
      }, 900);
      removalTimers.set(prev, t);
    });

    let entry = imgs[i];
    if (!entry) {
      const c = chapters[i];
      if (c.video || c.videos) {
        entry = buildPlayer(c, i);
      } else {
        const im = document.createElement('img');
        im.src = c.img;
        im.alt = '';
        im.loading = i === 0 ? 'eager' : 'lazy';
        im.decoding = 'async';
        entry = { main: im, extras: [] };
      }
      imgs[i] = entry;
    }

    const all = [entry.main, ...entry.extras];
    all.forEach(el => {
      clearTimeout(removalTimers.get(el));
      el.classList.remove('is-leaving');
      if (!el.isConnected) bg.appendChild(el);
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      all.forEach(el => el.classList.add('is-active'));
      // sync toggle position to player size on first show
      if (entry.extras[0]) {
        const h = entry.main.getBoundingClientRect().height;
        entry.extras[0].style.setProperty('--player-half', (h / 2) + 'px');
      }
    }));
  }

  function go(i) {
    if (i < 0 || i >= chapters.length || i === current) return;
    current = i;
    const c = chapters[i];

    [...progress.children].forEach((el, k) => el.classList.toggle('on', k <= i));

    footIdx.textContent = `${c.num} / ${String(chapters.length - 1).padStart(2,'0')}`;
    footTitle.textContent = c.title;

    plate.innerHTML = `<div class="lbl">Plate · ${c.num}</div><div class="sub">${c.kicker}</div>`;

    // download button: per-aspect for multi-video chapters is handled in applyAspect;
    // for single-video (or no video) chapters, set here.
    if (c.videos) {
      showDownload(true);
    } else if (c.video) {
      setDownload(c.download, 'Download');
      showDownload(true);
    } else {
      showDownload(false);
    }

    // rebuild panel to retrigger fade-in
    const panelHost = document.querySelector('.panel');
    const existing = panelHost.querySelector('.scroll');
    if (existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.className = 'scroll';
    wrap.id = 'panel';
    wrap.innerHTML = `
      <div class="kicker">
        <span class="idx">${c.num} / ${String(chapters.length - 1).padStart(2,'0')}</span>
        <span class="rule"></span>
        <span class="sub">${c.sub}</span>
      </div>
      <h1 class="title">${c.title}</h1>
      <div class="body">${c.body}</div>
    `;
    panelHost.appendChild(wrap);

    setImage(i);
    history.replaceState(null, '', `#${c.num}`);
  }

  // nav
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); go(current - 1); }
  });
  document.getElementById('prev').addEventListener('click', () => go(current - 1));
  document.getElementById('next').addEventListener('click', () => go((current + 1) % chapters.length));

  // initial — from hash or 0
  const start = chapters.findIndex(c => c.num === location.hash.slice(1));
  go(start >= 0 ? start : 0);
</script>
